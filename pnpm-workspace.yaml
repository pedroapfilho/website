# Not a workspace: this file exists because pnpm 11 reads the build allowlist
# from here and nowhere else. `packages` has to be non-empty because Vercel
# still installs with pnpm 9, which rejects a workspace file without it.
packages:
  - "."

allowBuilds:
  sharp: true

minimumReleaseAgeExclude:
  - "@next/env@16.3.0"
  - "@next/swc-darwin-arm64@16.3.0"
  - "@next/swc-darwin-x64@16.3.0"
  - "@next/swc-linux-arm64-gnu@16.3.0"
  - "@next/swc-linux-arm64-musl@16.3.0"
  - "@next/swc-linux-x64-gnu@16.3.0"
  - "@next/swc-linux-x64-musl@16.3.0"
  - "@next/swc-win32-arm64-msvc@16.3.0"
  - "@next/swc-win32-x64-msvc@16.3.0"
  - next@16.3.0
