# Not a workspace: this file exists because pnpm 11 reads the build allowlist
# from here and nowhere else. `packages` has to be non-empty because Vercel
# still installs with pnpm 9, which rejects a workspace file without it.
packages:
  - "."

allowBuilds:
  sharp: true

minimumReleaseAge: 10080
trustPolicy: no-downgrade

minimumReleaseAgeExclude:
  # Exempt exact pinned versions without exempting future releases.
  - "@fallow-cli/darwin-arm64@3.28.0"
  - "@fallow-cli/darwin-x64@3.28.0"
  - "@fallow-cli/linux-arm64-gnu@3.28.0"
  - "@fallow-cli/linux-arm64-musl@3.28.0"
  - "@fallow-cli/linux-x64-gnu@3.28.0"
  - "@fallow-cli/linux-x64-musl@3.28.0"
  - "@fallow-cli/win32-arm64-msvc@3.28.0"
  - "@fallow-cli/win32-x64-msvc@3.28.0"
  - "@oxlint-tsgolint/darwin-arm64@7.0.2003"
  - "@oxlint-tsgolint/darwin-x64@7.0.2003"
  - "@oxlint-tsgolint/linux-arm64@7.0.2003"
  - "@oxlint-tsgolint/linux-x64@7.0.2003"
  - "@oxlint-tsgolint/win32-arm64@7.0.2003"
  - "@oxlint-tsgolint/win32-x64@7.0.2003"
  - "@shadcn/lint@0.2.0"
  - fallow-type-aware@3.28.0
  - fallow@3.28.0
  - oxlint-tsgolint@7.0.2003
  - source-map-js@1.2.2
  - "@dashfoo/*"
  - "@easeia/*"
  - "@usebutr/*"
  - "@walletwright/*"
  - astro-awesomeness
  - oxlint-config-awesomeness
