overrides:
  # Security: force patched transitive releases to clear pnpm audit advisories.
  # Each pin is the lowest patched version within the already-resolved major.
  brace-expansion: "^5.0.9"

# Not a workspace: this file exists because pnpm 11 reads the build allowlist
# from here and nowhere else. `packages` has to be non-empty because Vercel
# still installs with pnpm 9, which rejects a workspace file without it.
packages:
  - "."

allowBuilds:
  sharp: true

minimumReleaseAge: 10080
trustPolicy: no-downgrade

minimumReleaseAgeExclude:
  # Grandfather already-shipped lockfile versions without exempting future releases.
  - "@fallow-cli/darwin-arm64@3.22.0"
  - "@fallow-cli/darwin-x64@3.22.0"
  - "@fallow-cli/linux-arm64-gnu@3.22.0"
  - "@fallow-cli/linux-arm64-musl@3.22.0"
  - "@fallow-cli/linux-x64-gnu@3.22.0"
  - "@fallow-cli/linux-x64-musl@3.22.0"
  - "@fallow-cli/win32-arm64-msvc@3.22.0"
  - "@fallow-cli/win32-x64-msvc@3.22.0"
  - "@types/node@26.4.1"
  - cn@0.2.4
  - fallow@3.22.0
  - fallow-type-aware@3.22.0
  - oxlint-plugin-react-doctor@0.9.13
  - "@dashfoo/*"
  - "@easeia/*"
  - "@usebutr/*"
  - "@walletwright/*"
  - astro-awesomeness
  - oxlint-config-awesomeness
