name: Typecheck
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
      # tsconfig includes .next/types/**, which only exists after a build. Without
      # this step tsc still passes, silently having checked no route types.
      - run: pnpm build
      - run: pnpm typecheck
