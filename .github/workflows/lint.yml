name: Lint
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  oxlint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      format: ${{ steps.format.outcome }}
      fallow: ${{ steps.fallow.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
      - name: Restore Next.js compiler cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-lint-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-lint-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-
            next-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('pnpm-lock.yaml') }}-lint-push-main-
      # Type-aware linting reads Next's generated route types, which only exist
      # after a build.
      - run: pnpm build
      - name: Check formatting
        id: format
        continue-on-error: true
        run: pnpm format:check
      - name: Check dead code
        id: fallow
        continue-on-error: true
        run: pnpm fallow:dead
      - run: pnpm oxlint --format=github .
  oxfmt:
    needs: oxlint
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report formatting result
        env:
          RESULT: ${{ needs.oxlint.outputs.format }}
        run: test "$RESULT" = success
  dead-code:
    needs: oxlint
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report dead-code result
        env:
          RESULT: ${{ needs.oxlint.outputs.fallow }}
        run: test "$RESULT" = success
